services:
  rsserpent:
    container_name: rsserpent
    image: ghcr.io/rsserpent-rev/rsserpent:main
    volumes:
      - type: bind
        source: ./docker/rsserpent.toml
        target: /etc/rsserpent/rsserpent.toml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8000:8000"
