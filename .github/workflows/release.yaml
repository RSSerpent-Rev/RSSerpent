name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: fregante/setup-git-user@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true
      - name: "Check Version for Pre-releases"
        run: |
          [[ "$(uv version --short)" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
          echo "IS_PRE_RELEASE=true" >> $GITHUB_ENV
      - name: "Build Stable Document"
        if: ${{ env.IS_PRE_RELEASE != true }}
        run: |
          uv sync --locked --only-group docs
          git fetch origin doc:doc
          uv run --locked --only-group docs mike deploy --push --update-aliases stable
      - name: "Generate Release Note"
        run: awk "/^## $(uv version --short)/{mark=1;next}/^## /{mark=0}mark" CHANGELOG.md > RELEASE.md
      - name: "Build Project"
        run: uv build
      - name: "Create Release on GitHub"
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ env.IS_PRE_RELEASE }}
      - name: "Publish to PyPI"
        if: github.repository == 'RSSerpent-Rev/RSSerpent'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
