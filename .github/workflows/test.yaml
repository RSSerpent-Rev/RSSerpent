name: Test

on:
  pull_request:
    paths:
      - '.github/workflows/test.yaml'
      - 'uv.lock'
      - 'rsserpent_rev/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/test.yaml'
      - 'uv.lock'
      - 'rsserpent_rev/**'
      - 'tests/**'
      - 'pyproject.toml'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run tests that need a browser or a network connection
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      matrix:
        python-version: ['3.14', '3.15']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Check Python style and types
        if: matrix.python-version == '3.14'
        run: |
          uv run --locked ruff check
          uv run --locked ruff format --check
          uv run --locked mypy rsserpent_rev tests
      - name: "Generate Coverage Report"
        run: uv run --locked pytest --cov --cov-report=term --cov-report=xml -n auto
      - name: Check the installed wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/rsserpent-dist"
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/rsserpent-wheel"
          uv pip install --python "$RUNNER_TEMP/rsserpent-wheel/bin/python" "$RUNNER_TEMP"/rsserpent-dist/*.whl
          printf 'plugins = ["rsserpent_rev.plugins.builtin"]\n' > "$RUNNER_TEMP/rsserpent.toml"
          "$RUNNER_TEMP/rsserpent-wheel/bin/rsserpent" check --config "$RUNNER_TEMP/rsserpent.toml"
      - name: Run live checks
        if: github.event_name == 'workflow_dispatch' && inputs.live_tests && matrix.python-version == '3.14'
        run: |
          uv run --locked playwright install --with-deps chromium
          uv run --locked pytest --no-cov --live -m live
      - name: "Upload to Codecov.io"
        if: github.repository == 'RSSerpent-Rev/RSSerpent' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
