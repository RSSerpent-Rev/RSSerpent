name: Test

on:
  pull_request:
    paths:
      - '.github/workflows/test.yaml'
      - 'poetry.lock'
      - 'rsserpent_rev/**'
      - 'tests/**'
      - 'pyproject.toml'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/test.yaml'
      - 'poetry.lock'
      - 'rsserpent_rev/**'
      - 'tests/**'
      - 'pyproject.toml'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run tests that need a browser or a network connection
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4.0.2
        with:
          path: |
            ~/.cache/pip
            .venv
          key: ${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
      - name: "Setup Poetry"
        run: |
          pip install --upgrade pip
          pip install --user poetry
          poetry config virtualenvs.in-project true
          poetry install
      - name: "Generate Coverage Report"
        run: poetry run pytest --cov --cov-report=term --cov-report=xml -n auto
      - name: Run live checks
        if: github.event_name == 'workflow_dispatch' && inputs.live_tests && matrix.python-version == '3.12'
        run: |
          poetry run playwright install --with-deps chromium
          poetry run pytest --no-cov --live -m live
      - name: "Upload to Codecov.io"
        if: github.repository == 'RSSerpent-Rev/RSSerpent' && github.event_name != 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
