name: Document

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/document.yaml'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'
    tags-ignore:
      - '**'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: fregante/setup-git-user@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true
      - name: "Build Latest Document"
        run: |
          uv sync --locked --only-group docs
          git fetch origin doc:doc
          uv run --locked --only-group docs mike deploy --push --update-aliases latest
