services:
  rsserpent:
    container_name: rsserpent
    build:
      context: .
      args:
        RSSERPENT_PLUGIN_REQUIREMENTS: ${RSSERPENT_PLUGIN_REQUIREMENTS:-official.txt}
    environment:
      RSSERPENT_CONFIG: /etc/rsserpent/rsserpent.toml
    volumes:
      - type: bind
        source: ${RSSERPENT_CONFIG_FILE:-./docker/rsserpent.toml}
        target: /etc/rsserpent/rsserpent.toml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8000:8000"
