ci:
  autofix_commit_msg: "ci: pre-commit auto fixes"
  autoupdate_commit_msg: "ci: pre-commit auto update"
  autoupdate_schedule: "monthly"
  skip: [ruff, ruff-format, mypy]
default_stages: [pre-commit]
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/crate-ci/typos
    rev: v1.22.0
    hooks:
      - id: typos
        name: Check Typos
  - repo: local
    hooks:
      - id: ruff
        name: Check Python Style
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Format Python
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: Type Check
        entry: uv run --locked mypy
        language: system
        types: [python]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        name: Check Commit Message
        stages: [commit-msg]
