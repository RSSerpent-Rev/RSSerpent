[project]
name = "rsserpent-rev"
version = "0.3.0"
description = "🐍 This snake helps you reconnect the Web, with RSS feeds!"
requires-python = ">=3.14,<3.16"
authors = [{ name = "Queensferry", email = "queensferry.me@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["rss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "arrow>=1.3,<2",
    "feedgen>=1,<2",
    "feedparser>=6.0.14,<7",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "lxml>=6,<7",
    "playwright>=1.65,<2",
    "pydantic[email]>=2.12,<3",
    "pyquery>=2,<3",
    "regex>=2026.11.19",
    "starlette>=0.49,<2",
]

[project.urls]
Homepage = "https://github.com/RSSerpent-Rev/RSSerpent"
Repository = "https://github.com/RSSerpent-Rev/RSSerpent"

[dependency-groups]
dev = ["mypy>=1.19", "pre-commit>=4", "ruff>=0.14", "types-lxml", "types-regex"]
deploy = ["uvicorn>=0.29,<1"]
tests = [
    "httpx2",
    "hypothesis>=6.23,<7",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "pytest-randomly>=4,<5",
    "pytest-xdist>=3,<4",
    "requests>=2.32,<3",
]
docs = [
    "setuptools",
    "mike>=2,<3",
    "mkdocs>=1.6,<2",
    "mkdocs-git-revision-date-plugin>=0.3,<1",
    "mkdocs-material>=9,<10",
    "mkdocs-static-i18n>=1.2,<2",
]

[tool.uv]
required-version = ">=0.13.9,<0.14"
default-groups = ["dev", "deploy", "tests"]

[tool.coverage.run]
include = ["rsserpent_rev/*"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover"
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-builtin
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-datetimez
    "DTZ",
    # flake8-debugger
    "T10",
    # eradicate
    "ERA",
    # flake8-print
    "T20",
    # pep8-naming
    "N",
    # tryceratops
    "TRY",
    # pygrep-hooks
    "PGH",
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
docstring-code-format = true

[tool.mypy]
plugins = ["pydantic.mypy"]
pretty = true
python_version = "3.14"
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
module = ["pyquery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["feedgen.*", "feedparser.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.nitpick]
style = ["./styles/main.toml", "./styles/local.toml"]
cache = "never"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--cov"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a browser or a connection to an upstream fixture"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rsserpent_rev"
module-root = ""
source-exclude = ["**/.DS_Store"]
